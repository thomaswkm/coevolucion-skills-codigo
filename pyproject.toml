[project]
name = "coevolution-skills-code"
version = "0.1.0"
description = "Reproducible repository selection and extraction for the skill/code co-evolution study"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4,<2",
    "PyYAML>=6.0,<7",
    "scipy>=1.14,<2",
]

[project.scripts]
extract-repositories = "coevolution_skills.extract:main"
prepare-validation = "coevolution_skills.validation:main"
review-validation = "coevolution_skills.reviewer:main"
process-activity = "coevolution_skills.process:main"
prepare-activity-validation = "coevolution_skills.activity_validation:prepare_main"
review-activity-validation = "coevolution_skills.activity_validation:review_main"
analyze-results = "coevolution_skills.analyze:main"
infer-results = "coevolution_skills.infer:main"

[dependency-groups]
dev = ["pytest>=8,<9", "matplotlib>=3.9,<4", "numpy>=1.26,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coevolution_skills"]
